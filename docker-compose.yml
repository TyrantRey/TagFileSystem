# Code by AkinoAlice@TyrantRey
#
# One TagFileSystem daemon for one root (DESIGN/v0-5-0.md §10). Copy
# .env.example to .env to change the defaults, then:
#
#   mkdir -p data                    # the root: must exist, writable by PUID:PGID
#   docker compose up -d --build
#   docker compose exec tfs tfs list
#   docker compose exec tfs tfs ui   # http://127.0.0.1:7411/ui/#token=...
#   docker compose logs -f tfs
#   docker compose down              # SIGTERM: in-flight runs get stop_timeout_seconds

services:
  tfs:
    build:
      context: .
      args:
        # Stamps `tfs --version`, /health and every run with the commit:
        #   GIT_COMMIT=$(git rev-parse HEAD) docker compose build
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: tagfilesystem:${TFS_IMAGE_TAG:-latest}
    # tini as pid 1: forwards SIGTERM to the daemon, reaps what add-ons spawn.
    init: true
    # The owner of every file the daemon creates in the root.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ${TFS_ROOT:-./data}:/data
      # A [remotes] target lives outside the root: mount it, then name its
      # container path in .tfs/config.toml (photos = "/remotes/photos").
      # - /srv/photos:/remotes/photos
    ports:
      # The container side is [daemon] port in .tfs/config.toml (7411).
      - "${TFS_PORT:-7411}:7411"
    environment:
      TZ: ${TZ:-UTC}
      # A root on NFS or SMB delivers no inotify events: poll it instead.
      # (Docker Desktop on Windows and macOS is detected on its own.)
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-}
    restart: unless-stopped
    # Longer than [daemon] stop_timeout_seconds (30 by default): past it
    # Docker sends SIGKILL and the lock stays behind.
    stop_grace_period: ${TFS_STOP_GRACE:-45s}
